[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "agent-revoke"
version = "0.1.0"
description = "Temporal consistency in multi-agent authorization via MESI cache coherence adaptation"
license = "BSD-3-Clause"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
simulate = "src.simulation.engine:main"
compare-strategies = "scripts.run_strategy_comparison:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = true
