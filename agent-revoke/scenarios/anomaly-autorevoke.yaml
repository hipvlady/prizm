# Scenario 3: Anomaly Auto-Revocation
# Business Context: A data analysis agent begins bulk-downloading records at an unusual time, indicating a potential breach.
# Shows: The trust scoring mechanism detecting a behavioral anomaly and triggering an automatic revocation without human intervention.
# Key Metric: time_to_detect_anomaly

simulation:
  duration_ticks: 300
  agents: 5
  action_probability: 0.7
  latency_ticks: 10
  transient_timeout_ticks: 100

scenario:
  name: "Anomaly Auto-Revocation"
  delegation_depth: 1
  cascade_revocation: false
  revocation_trigger_tick: null # No manual revocation
  anomaly_behavior_starts_tick: 50 # Simulation should model anomalous behavior starting at this tick

strategies:
  lazy:
    check_interval_ticks: 10
  lease:
    default_ttl_ticks: 3000
  exec_count:
    max_operations: 100

trust:
  initial_score: 0.8
  anomaly_threshold: 0.4 # Auto-revoke when score drops below this
  score_decay_on_anomaly: 0.5 # A significant drop when anomaly is detected
