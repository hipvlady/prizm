# Scenario 2: CRM High-Velocity Agent
# Business Context: A sales agent performing 100 API calls/sec has its credentials leaked.
# Shows: The superiority of 'exec-count' in bounding damage vs. a time-based 'lease' (TTL).
# Key Metric: unauthorized_actions_count

simulation:
  seed: 42
  duration_ticks: 120
  num_agents: 2

network:
  latency_ticks: 5
  message_loss_rate: 0.0

scenario:
  name: "CRM High-Velocity Agent"
  delegation_depth: 1 # Single powerful agent
  revocation_tick: 0 # Revoke immediately to measure bounded post-revoke damage
  cascade_on_revoke: false
  action_probability: 1.0
  agent_velocity: 100
  anomaly_start_tick: null
  anomaly_burst_rate: null
  anomaly_detection_window: null

strategies:
  eager: {}
  lazy:
    check_interval_ticks: 23 # Approx. 2300 unauthorized ops at 100 ops/tick
  lease:
    default_ttl_ticks: 60 # 60-tick TTL => ~6000 unauthorized ops at 100 ops/tick
  exec_count:
    max_operations: 500 # Spec authoritative value for CRM

trust:
  initial_score: 0.8
  anomaly_threshold: 0.4
  score_decay_on_anomaly: 0.3

delegation:
  max_depth: 3
  require_scope_subset: true
  propagate_remaining_ops: true

transient:
  timeout_ticks: 100
