# Scenario 2: CRM High-Velocity Agent
# Business Context: A sales agent performing 100 API calls/sec has its credentials leaked.
# Shows: The superiority of 'exec-count' in bounding damage vs. a time-based 'lease' (TTL).
# Key Metric: unauthorized_actions_count

simulation:
  seed: 42
  duration_ticks: 500
  num_agents: 5

network:
  latency_ticks: 5
  message_loss_rate: 0.001

scenario:
  name: "CRM High-Velocity Bulk Operations"
  delegation_depth: 2
  revocation_tick: 50
  cascade_on_revoke: true
  action_probability: 1.0
  agent_velocity: 100
  anomaly_start_tick: null
  anomaly_burst_rate: null
  anomaly_detection_window: null

strategies:
  eager: {}
  lazy:
    check_interval_ticks: 10
  lease:
    default_ttl_ticks: 6000
  exec_count:
    max_operations: 500

trust:
  initial_score: 0.8
  anomaly_threshold: 0.4
  score_decay_on_anomaly: 0.3

delegation:
  max_depth: 3
  require_scope_subset: true
  propagate_remaining_ops: true

transient:
  timeout_ticks: 100
