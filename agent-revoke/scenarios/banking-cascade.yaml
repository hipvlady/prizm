# Scenario 1: Banking Cascade Revocation
# Business Context: A payment processing agent in a deep delegation chain is compromised.
# Shows: The effectiveness of the 'eager' strategy in quickly propagating a root revocation down the chain.
# Key Metric: unauthorized_actions_by_depth

simulation:
  seed: 42
  duration_ticks: 300
  num_agents: 5

network:
  latency_ticks: 5
  message_loss_rate: 0.001

scenario:
  name: "Banking Cascade Revocation"
  delegation_depth: 3
  revocation_tick: 50
  cascade_on_revoke: true
  action_probability: 0.8
  agent_velocity: 10
  anomaly_start_tick: null
  anomaly_burst_rate: null
  anomaly_detection_window: null

strategies:
  eager: {}
  lazy:
    check_interval_ticks: 20
  lease:
    default_ttl_ticks: 600
  exec_count:
    max_operations: 10

trust:
  initial_score: 0.8
  anomaly_threshold: 0.4
  score_decay_on_anomaly: 0.3

delegation:
  max_depth: 3
  require_scope_subset: true
  propagate_remaining_ops: true

transient:
  timeout_ticks: 100
