# Scenario 1: Banking Cascade Revocation
# Business Context: A payment processing agent in a deep delegation chain is compromised.
# Shows: The effectiveness of the 'eager' strategy in quickly propagating a root revocation down the chain.
# Key Metric: unauthorized_actions_by_depth

simulation:
  seed: 42
  duration_ticks: 200
  num_agents: 10

network:
  latency_ticks: 10
  message_loss_rate: 0.0

scenario:
  name: "Banking Cascade Revocation"
  delegation_depth: 3
  revocation_tick: 100 # Revocation is triggered halfway through the simulation
  cascade_on_revoke: true
  action_probability: 0.5
  agent_velocity: 1
  anomaly_start_tick: null
  anomaly_burst_rate: null
  anomaly_detection_window: null

strategies:
  eager: {}
  lazy:
    check_interval_ticks: 40 # Deliberately larger than eager push latency to expose stale window gap
  lease:
    default_ttl_ticks: 120 # Ensure lease strategy converges within simulation horizon
  exec_count:
    max_operations: 10 # Spec authoritative value for banking

trust:
  initial_score: 0.8
  anomaly_threshold: 0.4
  score_decay_on_anomaly: 0.3

delegation:
  max_depth: 3
  require_scope_subset: true
  propagate_remaining_ops: true

transient:
  timeout_ticks: 100
